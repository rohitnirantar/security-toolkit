title: Volume Shadow Copy Deletion
id: e0f0429d-707b-4da0-af81-c08da2e1be1b
status: experimental
description: >
  Detects commands that delete Volume Shadow Copies, a step commonly taken by ransomware
  operators to prevent recovery before encrypting files.
references:
  - https://attack.mitre.org/techniques/T1490/
author: Rohit Nirantar
date: 2026/11/23
tags:
  - attack.impact
  - attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  selection_powershell:
    CommandLine|contains|all:
      - 'Win32_ShadowCopy'
      - 'Delete'
  condition: 1 of selection_*
falsepositives:
  - Backup or storage-management software cleaning up old snapshots
  - Administrators managing disk space
level: high
